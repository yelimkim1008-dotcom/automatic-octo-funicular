<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>협력사업 예산 자동 판정</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f5f7; --surface:#ffffff; --text:#1d2733; --muted:#5f6c7b; --line:#d9dee4;
  --ok:#1e6b4a; --ok-bg:#e1f1e8; --no:#a63a2b; --no-bg:#f8e4e0; --accent:#24405e;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14181d; --surface:#1d232a; --text:#e8ecf0; --muted:#98a4b2; --line:#323b45;
    --ok:#7fd1a6; --ok-bg:#1c3a2c; --no:#f0a093; --no-bg:#432421; --accent:#9db8d6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181d; --surface:#1d232a; --text:#e8ecf0; --muted:#98a4b2; --line:#323b45;
  --ok:#7fd1a6; --ok-bg:#1c3a2c; --no:#f0a093; --no-bg:#432421; --accent:#9db8d6;
  color-scheme:dark;
}
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.55}
main{max-width:860px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
.rule{margin:0 0 22px;color:var(--muted);font-size:.92rem}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.stat dt{color:var(--muted);font-size:.85rem;margin:0}
.stat dd{margin:4px 0 0;font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat.ok dd{color:var(--ok)} .stat.no dd{color:var(--no)}
.wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:560px;font-variant-numeric:tabular-nums}
th,td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th:last-child,td:last-child{text-align:center}
thead th{background:var(--accent);color:#fff;font-weight:600;font-size:.9rem;border-bottom:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) thead th{color:#14181d}}
:root[data-theme="dark"] thead th{color:#14181d}
tbody tr:last-child td{border-bottom:0}
.badge{display:inline-block;min-width:54px;padding:2px 10px;border-radius:999px;font-weight:700;font-size:.88rem}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.no{background:var(--no-bg);color:var(--no)}
tr.rejected td:nth-child(3){color:var(--no);font-weight:600}
@media (max-width:520px){.summary{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>협력사업 예산 자동 판정</h1>
  <p class="rule">한도액 = 인구수 × 10 · 신청액이 한도액보다 크면 반려, 같거나 작으면 승인</p>

  <dl class="summary" aria-label="요약">
    <div class="stat ok"><dt>승인 건수</dt><dd id="okCount">0</dd></div>
    <div class="stat no"><dt>반려 건수</dt><dd id="noCount">0</dd></div>
    <div class="stat"><dt>승인 신청액 합계</dt><dd id="okSum">0</dd></div>
  </dl>

  <div class="wrap">
    <table>
      <thead>
        <tr><th>지자체명</th><th>인구수</th><th>신청액</th><th>한도액</th><th>판정</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script>
const DATA = [
  {"지자체명":"가람군","인구수":30000,"신청액":250000},
  {"지자체명":"나봄시","인구수":45000,"신청액":500000},
  {"지자체명":"다솔구","인구수":80000,"신청액":600000},
  {"지자체명":"라윤시","인구수":60000,"신청액":700000},
  {"지자체명":"마을군","인구수":25000,"신청액":200000},
  {"지자체명":"바람시","인구수":100000,"신청액":950000},
  {"지자체명":"사계구","인구수":55000,"신청액":600000},
  {"지자체명":"아현시","인구수":70000,"신청액":650000},
  {"지자체명":"자연군","인구수":40000,"신청액":380000},
  {"지자체명":"차돌시","인구수":90000,"신청액":880000}
];
const fmt = n => n.toLocaleString("ko-KR");
let okCount = 0, noCount = 0, okSum = 0;
const tbody = document.getElementById("rows");

DATA.forEach(d => {
  const limit = d["인구수"] * 10;
  const approved = d["신청액"] <= limit;
  if (approved) { okCount++; okSum += d["신청액"]; } else { noCount++; }
  const tr = document.createElement("tr");
  if (!approved) tr.className = "rejected";
  tr.innerHTML =
    "<td>" + d["지자체명"] + "</td>" +
    "<td>" + fmt(d["인구수"]) + "</td>" +
    "<td>" + fmt(d["신청액"]) + "</td>" +
    "<td>" + fmt(limit) + "</td>" +
    '<td><span class="badge ' + (approved ? "ok" : "no") + '">' + (approved ? "승인" : "반려") + "</span></td>";
  tbody.appendChild(tr);
});

document.getElementById("okCount").textContent = okCount + "건";
document.getElementById("noCount").textContent = noCount + "건";
document.getElementById("okSum").textContent = fmt(okSum);
</script>
</body>
</html>
